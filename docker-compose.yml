version: "3.9"

services:
  outbound-call-ui:
    build: .
    container_name: outbound-call-ui
    ports:
      - "8501:8501"
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
